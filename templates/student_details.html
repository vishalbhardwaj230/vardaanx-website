<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Details | VardaanX</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register_style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="register-page">
    <div class="container mt-5">
        <div class="neon-box">
            <h2 class="glow text-center mb-4">🎓 Student Details</h2>

            <div class="mb-3">
                <label class="form-label text-info">Full Name</label>
                <input type="text" class="form-control" value="{{ student.full_name }}" readonly>
            </div>

            <div class="mb-3">
                <label class="form-label text-info">Email</label>
                <input type="email" class="form-control" value="{{ student.email }}" readonly>
            </div>

            <div class="mb-3">
                <label class="form-label text-info">Course Enrolled</label>
                <input type="text" class="form-control" value="{{ student.course }}" readonly>
            </div>

            <div class="text-center mt-4">
                <button class="btn btn-outline-warning w-100" id="logoutBtn">Logout</button>
            </div>
        </div>

        <div class="footer">© 2025 VardaanX | All Rights Reserved</div>
    </div>

    <script>
        document.getElementById("logoutBtn").addEventListener("click", () => {
            Swal.fire({
                icon: "question",
                title: "Confirm Logout",
                text: "Are you sure you want to log out?",
                showCancelButton: true,
                confirmButtonText: "Yes, Logout",
                confirmButtonColor: "#d33",
                cancelButtonColor: "#3085d6"
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = "{{ url_for('home') }}";
                }
            });
        });
    </script>
</body>

</html>
