<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | VardaanX Neon Portal</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Your Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register_style.css') }}">
</head>

<body class="register-page">
    <!-- Registration Form -->
    <div class="container">
        <div class="neon-box">
            <h2 class="glow">Student Registration</h2>
            <form id="registerForm">
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="email" name="email" placeholder="Email Address" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="text" name="course" placeholder="Course Name (e.g. Python Full Stack)" required>
                <button type="submit" class="btn btn-neon">Register</button>
            </form>

            <div class="text-center mt-3">
                <a href="{{ url_for('login') }}" class="btn btn-outline-warning w-100">
                    Already registered? Login
                </a>
            </div>

        </div>
        <div class="footer">© 2025 VardaanX | All Rights Reserved</div>
    </div>

    <script>
        document.querySelectorAll('.btn-neon').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.add('glow');
                setTimeout(() => btn.classList.remove('glow'), 800);
            });
        });
    </script>
    <script>
        document.getElementById("registerForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const formData = new FormData(this);
            const response = await fetch("/register", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (data.status === "exists") {
                Swal.fire({
                    icon: "warning",
                    title: "Already Registered",
                    text: "This email is already registered. Please login instead.",
                    confirmButtonColor: "#ffc107"
                });
            } else if (data.status === "success") {
                Swal.fire({
                    icon: "success",
                    title: "Registration Successful!",
                    text: "Redirecting to your student details page...",
                    showConfirmButton: false,
                    timer: 2000
                }).then(() => {
                    window.location.href = data.redirect;
                });
            } else {
                Swal.fire({
                    icon: "error",
                    title: "Something went wrong",
                    text: data.error || "Please check your details and try again.",
                    confirmButtonColor: "#d33"
                });
            }
        });
    </script>

</body>

</html>
