<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VardaanX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register_style.css') }}">
</head>

<body class="register-page">
    <div class="container">
        <div class="neon-box">
            <h2 class="glow">Login</h2>
            <form id="loginForm">
                <input type="email" name="email" placeholder="Email Address" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="btn btn-neon">Login</button>
            </form>

        </div>
        <div class="footer">© 2025 VardaanX | All Rights Reserved</div>
    </div>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const formData = new FormData(this);

            const res = await fetch("/login", { method: "POST", body: formData });
            const data = await res.json();

            if (data.status === "success") {
                Swal.fire({
                    icon: "success",
                    title: "Welcome back!",
                    text: "Redirecting to your dashboard...",
                    showConfirmButton: false,
                    timer: 1500
                }).then(() => {
                    window.location.href = data.redirect;
                });
            }
            else if (data.status === "error") {
                Swal.fire({
                    icon: "error",
                    title: "Invalid Credentials",
                    text: data.message,
                    confirmButtonColor: "#d33"
                });
            }
            else {
                Swal.fire({
                    icon: "error",
                    title: "Unexpected Error",
                    text: "Please try again later.",
                    confirmButtonColor: "#d33"
                });
            }
        });
    </script>


</body>

</html>
